<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 320" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="50%" stop-color="#080e2b" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#00F7FF" />
      <stop offset="80%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#7F00FF" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#00FFA3" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Scanline Gradient -->
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F7FF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreGlowBanner" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes scan {
      0% { transform: translateY(-50px); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(340px); opacity: 0; }
    }
    .title-font {
      font-family: 'Space Grotesk', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .code-font {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
    }
  </style>

  <!-- Frame Background -->
  <rect x="2" y="2" width="946" height="316" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Cyber Grid Background -->
  <g opacity="0.09" stroke="#00F7FF" stroke-width="0.75">
    <line x1="0" y1="40" x2="950" y2="40" />
    <line x1="0" y1="80" x2="950" y2="80" />
    <line x1="0" y1="120" x2="950" y2="120" />
    <line x1="0" y1="160" x2="950" y2="160" />
    <line x1="0" y1="200" x2="950" y2="200" />
    <line x1="0" y1="240" x2="950" y2="240" />
    <line x1="0" y1="280" x2="950" y2="280" />
    <line x1="80" y1="0" x2="80" y2="320" />
    <line x1="180" y1="0" x2="180" y2="320" />
    <line x1="280" y1="0" x2="280" y2="320" />
    <line x1="380" y1="0" x2="380" y2="320" />
    <line x1="480" y1="0" x2="480" y2="320" />
    <line x1="580" y1="0" x2="580" y2="320" />
    <line x1="680" y1="0" x2="680" y2="320" />
    <line x1="780" y1="0" x2="780" y2="320" />
    <line x1="880" y1="0" x2="880" y2="320" />
  </g>

  <!-- Animated Laser Scanline -->
  <rect x="10" y="0" width="930" height="2.5" fill="url(#scanBeam)">
    <animateTransform attributeName="transform" type="translate" from="0 -10" to="0 320" dur="4.5s" repeatCount="indefinite" />
  </rect>

  <!-- Futuristic Corner Accents -->
  <g stroke="#00F7FF" stroke-width="2" fill="none">
    <path d="M 15 35 L 15 15 L 35 15" />
    <path d="M 935 35 L 935 15 L 915 15" stroke="#00FFA3" />
    <path d="M 15 285 L 15 305 L 35 305" stroke="#7F00FF" />
    <path d="M 935 285 L 935 305 L 915 305" />
  </g>

  <!-- Ambient Glow Blurs in Background -->
  <circle cx="200" cy="160" r="90" fill="#7F00FF" opacity="0.18" filter="url(#coreGlowBanner)" />
  <circle cx="750" cy="160" r="100" fill="#00F7FF" opacity="0.16" filter="url(#coreGlowBanner)" />
  <circle cx="480" cy="80" r="80" fill="#00FFA3" opacity="0.12" filter="url(#coreGlowBanner)" />

  <!-- Top Telemetry Row -->
  <g class="code-font" font-size="11">
    <rect x="42" y="32" width="220" height="24" rx="12" fill="#0b1333" stroke="#1d2e68" stroke-width="1" />
    <circle cx="56" cy="44" r="4" fill="#00FFA3">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="70" y="48" fill="#00FFA3" font-weight="700" letter-spacing="1">STATUS: LEVEL_100 ACTIVE</text>

    <!-- Right Side Pill -->
    <rect x="688" y="32" width="220" height="24" rx="12" fill="#0b1333" stroke="#1d2e68" stroke-width="1" />
    <text x="798" y="48" text-anchor="middle" fill="#00F7FF" font-weight="700" letter-spacing="1">ENG // CS DEPT // 2026</text>
  </g>

  <!-- Main Identity Header -->
  <g text-anchor="middle">
    <!-- Greeting Sub-tag -->
    <text x="475" y="95" class="code-font" font-size="13" font-weight="600" fill="#8B9CC7" letter-spacing="4">
      &lt; HELLO WORLD // I AM &gt;
    </text>

    <!-- Giant Name -->
    <text x="475" y="152" class="title-font" font-size="44" font-weight="900" fill="url(#nameGrad)" letter-spacing="3.5" filter="url(#neonFilter)">
      DURVANKUR JOSHI
    </text>

    <!-- Subtitle / Identity Triad -->
    <text x="475" y="185" class="code-font" font-size="13.5" font-weight="700" fill="#F5F7FF" letter-spacing="3">
      <tspan fill="#00F7FF">AI ENGINEER</tspan>
      <tspan fill="#8B9CC7"> // </tspan>
      <tspan fill="#00FFA3">FULL-STACK</tspan>
      <tspan fill="#8B9CC7"> // </tspan>
      <tspan fill="#7F00FF">WEB3 BUILDER</tspan>
    </text>

    <!-- Dynamic Cycling Role Banner -->
    <g transform="translate(475, 230)">
      <!-- Cyber Pill Container -->
      <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#0a122e" stroke="#00F7FF" stroke-width="1.2" filter="url(#neonFilter)" />
      
      <!-- Prompt Symbol -->
      <text x="-210" y="5" class="code-font" font-size="14" font-weight="800" fill="#00FFA3">&gt;_</text>
      
      <!-- Animated Typing / Rotating Roles -->
      <!-- Role 1: AI & Agentic Systems Architect -->
      <text x="-180" y="5" class="code-font" font-size="13.5" font-weight="800" fill="#F5F7FF" text-anchor="start" letter-spacing="1">
        Building Autonomous AI Agents &amp; RAG
        <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.22;0.25;0.5;0.72;0.75;0.95;0.98;1" dur="12s" repeatCount="indefinite" />
      </text>

      <!-- Role 2: Decentralized & Smart Contract Dev -->
      <text x="-180" y="5" class="code-font" font-size="13.5" font-weight="800" fill="#00FFA3" text-anchor="start" letter-spacing="1">
        Deploying Web3 &amp; Zero-Knowledge DApps
        <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.25;0.28;0.48;0.51;0.75;0.95;0.98;1" dur="12s" repeatCount="indefinite" />
      </text>

      <!-- Role 3: Full-Stack High-Performance Dev -->
      <text x="-180" y="5" class="code-font" font-size="13.5" font-weight="800" fill="#00F7FF" text-anchor="start" letter-spacing="1">
        Crafting Full-Stack &amp; Real-time Systems
        <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.5;0.53;0.73;0.76;0.85;0.95;0.98;1" dur="12s" repeatCount="indefinite" />
      </text>

      <!-- Role 4: Hackathon Winner & Innovator -->
      <text x="-180" y="5" class="code-font" font-size="13.5" font-weight="800" fill="#FFD700" text-anchor="start" letter-spacing="1">
        🏆 Winner: Web Wizard Hackathon
        <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" keyTimes="0;0.75;0.78;0.95;0.98;0.99;0.995;1;1" dur="12s" repeatCount="indefinite" />
      </text>
    </g>

    <!-- Bottom Badges / Tech Highlights Bar -->
    <g class="code-font" font-size="10.5" fill="#8B9CC7" transform="translate(475, 282)" letter-spacing="1.5">
      <text x="0" y="0">
        <tspan fill="#00F7FF">● LANGGRAPH</tspan> &nbsp;|&nbsp; 
        <tspan fill="#00FFA3">● FASTAPI</tspan> &nbsp;|&nbsp; 
        <tspan fill="#FFFFFF">● NEXT.JS</tspan> &nbsp;|&nbsp; 
        <tspan fill="#7F00FF">● SOLIDITY</tspan> &nbsp;|&nbsp; 
        <tspan fill="#00F7FF">● PGVECTOR</tspan>
      </text>
    </g>
  </g>
</svg>
